[package]
name = "liblbfgs-compliant-rs"
version = "0.1.5"
authors = ["Johan Henriksson <mahogny@areta.org>"]
description = "Faithful pure-rust version of libLBFGS"
edition = "2021"
license = "MIT"
repository = "https://github.com/henriksson-lab/liblbfgs-compliant-rs"
homepage = "https://github.com/henriksson-lab/liblbfgs-compliant-rs"
keywords = ["lbfgs", "optimization", "minimization", "quasi-newton"]
categories = ["science", "mathematics", "algorithms"]
readme = "README.md"
exclude = [
    ".claude/",
    ".codex",
    ".tmp/",
    ".*.swp",
    ".gitignore",
    "Cargo.lock",
    "src/liblbfgs/",
    "CMakeLists.txt",
    "Config.cmake.in",
    ".gitmodules",
    "CLAUDE.md",
    "old_README.md",
]

[features]
default = []
simd = []
compare-c = ["cmake"]

[dependencies]

[build-dependencies]
cmake = { version = "0.1.45", optional = true }

[[bench]]
name = "compare_perf"
harness = false
required-features = ["compare-c"]
